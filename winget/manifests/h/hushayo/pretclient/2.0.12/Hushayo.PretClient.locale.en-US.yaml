ShortDescription: Compact, offline-first Minecraft launcher for Windows (Vanilla + Fabric, Modrinth mods).
Description: |-
  PretClient is a compact, offline-first Minecraft launcher for Windows (WinUI 3, C++).
  Vanilla / Fabric instances with offline play, per-instance Modrinth mods, live CPU/RAM/GPU stats and game log, Java auto-detect, and one-click self-update from GitHub Releases.
  Unpackaged exe via Inno Setup — per-user install, no MSIX, no admin.
