name: Build WinUI 3 (C++)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
      - 'release-*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Build the Inno Setup installer'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Keep the in-app updater's baseline in sync with the VERSION file the
      # auto-tag workflow maintains (stamp into source, never committed, so
      # this cannot feed back into the tag loop).
      - name: Stamp updater version from VERSION
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          $f = "PretClient/Update/Updater.cpp"
          $t = Get-Content $f -Raw
          $t = $t -replace 'return L"v[0-9]+\.[0-9]+\.[0-9]+[^"]*";', ('return L"v' + $v + '";')
          Set-Content $f $t -NoNewline
          Write-Host "Stamped updater baseline v$v"

      - name: Build x64 Release (unpackaged exe)
        run: msbuild PretClient.sln /restore /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: List outputs
        if: always()
        run: |
          if (Test-Path x64/Release) { Get-ChildItem -Recurse x64/Release | Select-Object FullName -First 50 } else { echo "no x64/Release outputs" }
        shell: pwsh

      - name: Read version
        if: ${{ success() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.build_installer)) }}
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        if: ${{ success() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.build_installer)) }}
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build custom setup
        if: ${{ success() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.build_installer)) }}
        run: |
          $v = "${{ steps.version.outputs.version }}"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion="$v+${{ github.run_number }}" installer\Setup.iss
        shell: pwsh

      - name: Upload setup
        if: ${{ success() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.build_installer)) }}
        uses: actions/upload-artifact@v4
        with:
          name: PretClient-Setup
          path: installer/Output/PretClient-Setup.exe
          if-no-files-found: error

      # The in-app updater polls GitHub Releases, so tag builds must publish
      # one with the installer attached (and workflow runs on a tag ref mean
      # github.ref_type == 'tag' even when dispatched by the auto-tag job).
      - name: Publish GitHub Release
        if: ${{ success() && github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "installer/Output/PretClient-Setup.exe" --title "$env:GITHUB_REF_NAME" --generate-notes
        shell: pwsh
