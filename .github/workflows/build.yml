name: Build WinUI 3 (C++)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x64 Release (unpackaged exe)
        run: msbuild PretClient.sln /restore /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

      - name: List outputs
        if: always()
        run: |
          if (Test-Path x64/Release) { Get-ChildItem -Recurse x64/Release | Select-Object FullName -First 50 } else { echo "no x64/Release outputs" }
        shell: pwsh

      - name: Install Inno Setup
        if: success()
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build custom setup
        if: success()
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion="0.0.1-dev+${{ github.run_number }}" installer\Setup.iss'
        shell: pwsh

      - name: Upload setup
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PretClient-Setup
          path: installer/Output/PretClient-Setup.exe
          if-no-files-found: error
